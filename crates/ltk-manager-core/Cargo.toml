[package]
name = "ltk-manager-core"
version = "0.1.0"
description = "UI-agnostic core library for LTK Manager"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeagueToolkit/ltk-manager"

[features]
# Derive `ts_rs::TS` on core types so the Tauri shell can export bindings for
# types that cross IPC (e.g. `Config` flattened into `Settings`).
ts = ["dep:ts-rs"]

[dependencies]
ltk_fantome = { version = "0.6.0" }
ltk_file = { version = "0.2.8", features = ["serde"] }
ltk_modpkg = { version = "0.6.0", features = ["project"] }
ltk_mod_project = { version = "0.5.0" }
ltk_wad = "0.2.12"

camino = "1.2"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
image = "0.25.2"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking"] }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug = "0.1"
tar = "0.4"
thiserror = "2"
tracing = "0.1"
ts-rs = { version = "12", optional = true }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
webp = "0.3"
zip = "2.2.0"

[dev-dependencies]
assert_matches = "1.5"
tempfile = "3"
