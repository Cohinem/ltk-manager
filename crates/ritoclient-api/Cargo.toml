[package]
name = "ritoclient-api"
version = "0.1.0"
description = "Client for the Riot Client's local API - discovery, launching, and the product registry"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/LeagueToolkit/ltk-manager"

[features]
# Derive `ts_rs::TS` on the types that cross an IPC boundary. Enabled by
# `ltk-manager-core/ts`; see that crate for why the bindings only generate in a
# workspace-wide build.
ts = ["dep:ts-rs"]

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_matches = { workspace = true }
tempfile = { workspace = true }
