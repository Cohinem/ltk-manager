[workspace]
members = ["src-tauri", "crates/ltk-manager-core"]
resolver = "2"

[workspace.dependencies]
# Pinned to a rev until it ships on crates.io. Declared here rather than in
# `ltk-manager-core` so moving the pin is one edit in the place every other
# pinned dependency is written down.
ritoclient = { git = "https://github.com/Crauzer/ritoclient", rev = "f8283eb8f7ac94ffa66ccc9e3f44bbbb2ecbd631" }

# Pinned to a rev until they ship on crates.io. Both crates must come from the
# same rev: `ltk_mimir_cache` hands back `ltk_hashdb` types.
ltk_hashdb = { git = "https://github.com/LeagueToolkit/mimir", rev = "c3282dfc0f7a03675bddda434b3202b05fe4a6a7" }
ltk_mimir_cache = { git = "https://github.com/LeagueToolkit/mimir", rev = "c3282dfc0f7a03675bddda434b3202b05fe4a6a7" }

# Pinned to a rev until they ship on crates.io. Every league-mod crate must come
# from the same rev: `ltk_overlay` hands back `ltk_mod_project`, `ltk_modpkg`
# and `ltk_fantome` types, so a crates.io copy of any of them would be a
# distinct crate to the compiler.
ltk_fantome = { git = "https://github.com/LeagueToolkit/league-mod", rev = "3533335c1a9aedc951954f0898c854f0041130d5" }
ltk_mod_project = { git = "https://github.com/LeagueToolkit/league-mod", rev = "3533335c1a9aedc951954f0898c854f0041130d5", features = ["modpkg", "fantome"] }
ltk_modpkg = { git = "https://github.com/LeagueToolkit/league-mod", rev = "3533335c1a9aedc951954f0898c854f0041130d5" }
ltk_overlay = { git = "https://github.com/LeagueToolkit/league-mod", rev = "3533335c1a9aedc951954f0898c854f0041130d5" }

# Pinned to a rev until `ltk_wad` 0.4 ships on crates.io. All three must come
# from the same rev: the git `ltk_wad` takes `ltk_file` and `ltk_hash` by path,
# and a `LeagueFileKind` or a `WadHash` out of a git source is a different type
# to the compiler than the crates.io one of the same version. `ltk_meta` is here
# rather than on its published 0.6.1 for that reason - it hands back the
# `WadHash` that a `WadChunkLink` holds, and the game index keys chunks by
# `ltk_wad`'s. `ltk_overlay` and `ltk_texture` keep the crates.io copy, and
# nothing hands a file kind across the two.
ltk_file = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "2beb112ba633712a4dc0e28914231e5117d9ad5f", features = ["serde"] }
ltk_hash = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "2beb112ba633712a4dc0e28914231e5117d9ad5f", features = ["serde"] }
ltk_meta = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "2beb112ba633712a4dc0e28914231e5117d9ad5f", features = ["serde"] }
ltk_wad = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "2beb112ba633712a4dc0e28914231e5117d9ad5f" }

ltk_rst = "0.2.1"
ltk_texture = "0.6.0"

camino = "1.2"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
image = "0.25.2"
indexmap = { version = "2", features = ["serde"] }
lru = "0.18"
regex = "1"
reqwest = { version = "0.12", features = ["blocking"] }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
slug = "0.1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
webp = "0.3"
windows-sys = "0.59"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "xxh64"] }
zip = "2.2.0"

rmp-serde = "1"
base64 = "0.22"
sha2 = "0.10"

assert_matches = "1.5"
filetime = "0.2"
