[workspace]
members = ["src-tauri", "crates/ltk-manager-core"]
resolver = "2"

[workspace.dependencies]
ltk_fantome = "0.6.0"
ltk_file = { version = "0.2.8", features = ["serde"] }
ltk_mod_project = "0.5.0"
ltk_modpkg = { version = "0.6.0", features = ["project"] }
ltk_wad = "0.2.12"

camino = "1.2"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
image = "0.25.2"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking"] }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
slug = "0.1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
webp = "0.3"
windows-sys = "0.59"
zip = "2.2.0"

assert_matches = "1.5"
